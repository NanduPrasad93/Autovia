{% extends 'core/base.html' %}
{% load static %}

{% block title %}Password Reset Complete | AutoVia{% endblock %}

{% block content %}
<section class="section-padding bg-light py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 text-center bg-white">
                    <div class="rounded-circle bg-success bg-opacity-10 text-success mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 64px; height: 64px; font-size: 1.8rem;">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-2">Password Changed Successfully</h3>
                    <p class="text-muted small mb-4">
                        Your password has been reset. You can now use your new password to sign in to your AutoVia account.
                    </p>
                    <div>
                        <a href="{% url 'accounts:login' %}" class="btn btn-primary-autovia px-4 py-2">
                            <i class="fa-solid fa-arrow-right-to-bracket me-1"></i> Sign In Now
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
